[vars]
bin_name = "process-compose"
upstream_repo = "https://github.com/F1bonacc1/process-compose.git"
version = "v1.85.0"
src = "{{config_root}}/.src"
bin = "{{config_root}}/.bin"
bin_path = "{{config_root}}/.bin/process-compose"
data = "{{config_root}}/.data"
socket = "{{config_root}}/.pc.sock"
config = "{{config_root}}/../process-compose.yaml"
release_repo = "joeblew999/plat-telemetry"
release_version = "latest"
release_url = "https://github.com/joeblew999/plat-telemetry/releases/download/latest"
dist_dir = "{{config_root}}/../.dist"

[env]
GOWORK = "off"

# --- src: tasks ---

[tasks."src:clone"]
description = "Clone the upstream repository at pinned version"
run = "test -d {{vars.src}} || git clone --branch {{vars.version}} --depth 1 {{vars.upstream_repo}} {{vars.src}}"

[tasks."src:update"]
description = "Fetch and checkout pinned version"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["git fetch --tags", "git checkout {{vars.version}}"]

# --- bin: tasks ---

[tasks."bin:build"]
description = "Build process-compose binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
go build -o {{vars.bin_path}} .
{
  echo "commit: $(git -C {{vars.src}} rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
  echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
  echo "checksum: $(shasum -a 256 {{vars.bin_path}} | awk '{print $1}')"
} > {{vars.bin}}/.version
"""

[tasks."bin:download"]
description = "Download pre-built binary from release"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
GOOS=$(go env GOOS)
GOARCH=$(go env GOARCH)
curl -L https://github.com/F1bonacc1/process-compose/releases/download/{{vars.version}}/{{vars.bin_name}}_${GOOS}_${GOARCH}.tar.gz | tar xz -C {{vars.bin}}
echo "{{vars.version}}" > {{vars.bin}}/.version
"""

# --- dev: tasks ---

[tasks."dev:run"]
description = "Run process-compose from source (development mode)"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["mkdir -p {{vars.data}}", "go run . up -U -u {{vars.socket}} -f {{vars.config}} -t=false"]

# --- service tasks (alphabetical) ---

[tasks.attach]
description = "Attach to running Process Compose instance"
depends = ["ensure"]
run = "{{vars.bin_path}} attach -U -u {{vars.socket}}"

[tasks."config:version"]
description = "Output the pinned version"
run = "echo {{vars.version}}"
quiet = true

[tasks.deps]
description = "Download dependencies"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go mod download"

[tasks.ensure]
description = "Ensure binary exists (build from source)"
run = "test -f {{vars.bin_path}} || mise run -C {{config_root}} bin:build"

[tasks.install]
description = "Install process-compose binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go install ."

[tasks.logs]
description = "Tail logs for a process (usage: PROC=nats mise run logs)"
depends = ["ensure"]
run = "{{vars.bin_path}} process logs ${PROC:-nats} -f -U -u {{vars.socket}}"

[tasks.run]
description = "Run all services with Process Compose (TUI mode)"
depends = ["ensure"]
run = ["mkdir -p {{vars.data}}", "{{vars.bin_path}} up -U -u {{vars.socket}} -f {{vars.config}}"]

[tasks."run:fg"]
description = "Run all services in foreground (no TUI)"
depends = ["ensure"]
run = ["mkdir -p {{vars.data}}", "{{vars.bin_path}} up -U -u {{vars.socket}} -f {{vars.config}} -t=false"]

[tasks.status]
description = "Show status of all processes"
depends = ["ensure"]
run = "{{vars.bin_path}} process list -U -u {{vars.socket}}"

[tasks.stop]
description = "Stop all services"
depends = ["ensure"]
run = "{{vars.bin_path}} down -U -u {{vars.socket}}"

[tasks.test]
description = "Run tests"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go test -v ./..."

[tasks.package]
description = "Package binary for release"
run = """
GOOS=${GOOS:-$(go env GOOS)}
GOARCH=${GOARCH:-$(go env GOARCH)}
DIST=${DIST:-{{vars.dist_dir}}}
tar -czvf ${DIST}/{{vars.bin_name}}-${GOOS}-${GOARCH}.tar.gz -C {{vars.bin}} {{vars.bin_name}}
"""

# --- clean: tasks (alphabetical) ---

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf {{vars.bin}} && rm -f {{vars.socket}}"

[tasks."clean:all"]
description = "Clean everything (.src, .bin, .data, socket)"
run = "rm -rf {{vars.src}} {{vars.bin}} {{vars.data}} {{vars.socket}}"

[tasks."clean:data"]
description = "Clean data directory"
run = "rm -rf {{vars.data}}"

[tasks."clean:src"]
description = "Clean source directory"
run = "rm -rf {{vars.src}}"
