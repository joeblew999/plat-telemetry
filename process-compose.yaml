version: "0.5"

# Delegate all implementation details to subsystem Taskfiles
# Process Compose only orchestrates: process dependencies and restart policies
# Commands call task <subsystem>:run (execute binary), probes call task <subsystem>:health (returns immediately)

# Load environment variables from root .env file
env_file:
  - .env

processes:
  arc:
    command: mise run arc:run
    working_dir: .
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run arc:health
      initial_delay_seconds: 3
      period_seconds: 5

  sync-cf-worker:
    command: mise run sync-cf-worker:run
    working_dir: .
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run sync-cf-worker:health
      initial_delay_seconds: 5
      period_seconds: 10

  docs:
    command: mise run docs:run
    working_dir: .
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run docs:health
      initial_delay_seconds: 5
      period_seconds: 5

  liftbridge:
    command: mise run liftbridge:run
    working_dir: .
    depends_on:
      nats:
        condition: process_healthy
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 3
    readiness_probe:
      exec:
        command: mise run liftbridge:health
      initial_delay_seconds: 3
      period_seconds: 5

  nats:
    command: mise run nats:run
    working_dir: .
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 3
    readiness_probe:
      exec:
        command: mise run nats:health
      initial_delay_seconds: 2
      period_seconds: 5

  sync-cf:
    command: mise run sync-cf:run
    working_dir: .
    environment:
      - CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
      - CF_API_TOKEN=${CF_API_TOKEN}
      - CF_WEBHOOK_SECRET=${CF_WEBHOOK_SECRET}
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run sync-cf:health
      initial_delay_seconds: 3
      period_seconds: 10

  sync-gh:
    command: mise run sync-gh:run
    working_dir: .
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run sync-gh:health
      initial_delay_seconds: 3
      period_seconds: 10

  sync-gh-poller:
    command: mise run sync-gh:run:poll
    working_dir: .
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run sync-gh:health
      initial_delay_seconds: 3
      period_seconds: 30

  sync-gh-taskfile-poller:
    command: mise run sync-gh:run:poll-taskfiles
    working_dir: .
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run sync-gh:health
      initial_delay_seconds: 3
      period_seconds: 30

  telegraf:
    command: mise run telegraf:run
    working_dir: .
    depends_on:
      arc:
        condition: process_healthy
      liftbridge:
        condition: process_healthy
    shutdown:
      signal: 15
      timeout_seconds: 10
    availability:
      restart: on_failure
      backoff_seconds: 5
    readiness_probe:
      exec:
        command: mise run telegraf:health
      initial_delay_seconds: 3
      period_seconds: 5
