[vars]
bin_name = "telegraf"
upstream_repo = "https://github.com/Basekick-Labs/telegraf.git"
version = "master"
src = "{{config_root}}/.src"
bin = "{{config_root}}/.bin"
bin_path = "{{config_root}}/.bin/telegraf"
data = "{{config_root}}/.data"
release_repo = "joeblew999/plat-telemetry"
release_version = "latest"
release_url = "https://github.com/joeblew999/plat-telemetry/releases/download/latest"
dist_dir = "{{config_root}}/../.dist"

[env]
GOWORK = "off"

# --- src: tasks ---

[tasks."src:clone"]
description = "Clone the upstream repository at pinned version"
run = "test -d {{vars.src}} || git clone --branch {{vars.version}} --depth 1 {{vars.upstream_repo}} {{vars.src}}"

[tasks."src:update"]
description = "Fetch and checkout pinned version"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["git fetch --tags", "git checkout {{vars.version}}"]

# --- bin: tasks ---

[tasks."bin:build"]
description = "Build telegraf binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
make build
cp {{vars.bin_name}} {{vars.bin}}/
{
  echo "commit: $(git -C {{vars.src}} rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
  echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
  echo "checksum: $(shasum -a 256 {{vars.bin_path}} | awk '{print $1}')"
} > {{vars.bin}}/.version
"""

[tasks."bin:download"]
description = "Download pre-built binary from release"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
GOOS=$(go env GOOS)
GOARCH=$(go env GOARCH)
curl -L {{vars.release_url}}/{{vars.bin_name}}-${GOOS}-${GOARCH}.tar.gz | tar xz -C {{vars.bin}}
echo "{{vars.release_version}}" > {{vars.bin}}/.version
"""

# --- dev: tasks ---

[tasks."dev:run"]
description = "Run telegraf from source (development mode)"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["mkdir -p {{vars.data}}", "go run ./cmd/telegraf --config {{config_root}}/telegraf.conf"]

# --- service tasks (alphabetical) ---

[tasks.config]
description = "Generate sample config"
run = "test -f {{vars.bin_path}} && {{vars.bin_path}} config > {{config_root}}/telegraf.sample.conf"

[tasks."config:version"]
description = "Output the pinned version"
run = "echo {{vars.version}}"
quiet = true

[tasks.deps]
description = "Download dependencies"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go mod download"

[tasks.ensure]
description = "Ensure binary exists (build from source)"
run = "test -f {{vars.bin_path}} || mise run -C {{config_root}} bin:build"

[tasks.health]
description = "Check if Telegraf is healthy"
run = "pgrep -f '{{vars.bin_name}} --config' > /dev/null"

[tasks.install]
description = "Install telegraf binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "make install"

[tasks.package]
description = "Package binary for release"
run = """
GOOS=${GOOS:-$(go env GOOS)}
GOARCH=${GOARCH:-$(go env GOARCH)}
DIST=${DIST:-{{vars.dist_dir}}}
tar -czvf ${DIST}/{{vars.bin_name}}-${GOOS}-${GOARCH}.tar.gz -C {{vars.bin}} {{vars.bin_name}}
"""

[tasks.plugins]
description = "List available plugins"
run = ["{{vars.bin_path}} --input-list", "{{vars.bin_path}} --output-list"]

[tasks.run]
description = "Run telegraf binary"
depends = ["ensure"]
run = ["mkdir -p {{vars.data}}", "{{vars.bin_path}} --config {{config_root}}/telegraf.conf"]

[tasks.test]
description = "Run tests"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "make test"

[tasks."test:short"]
description = "Run short tests"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go test -short ./..."

# --- clean: tasks (alphabetical) ---

[tasks.clean]
description = "Clean build artifacts"
run = ["rm -rf {{vars.bin}}", "rm -f {{config_root}}/telegraf.sample.conf"]

[tasks."clean:all"]
description = "Clean everything (.src, .bin, .data)"
run = "rm -rf {{vars.src}} {{vars.bin}} {{vars.data}}"

[tasks."clean:data"]
description = "Clean data directory"
run = "rm -rf {{vars.data}}"

[tasks."clean:src"]
description = "Clean source directory"
run = "rm -rf {{vars.src}}"
