# Telegraf - build from source (Basekick-Labs/telegraf fork)

["telegraf:src:clone"]
description = "Clone upstream Telegraf repository"
depends = ["sync-git:ensure"]
run = """
#!/usr/bin/env bash
[ -d telegraf/.src ] && exit 0
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} clone https://github.com/Basekick-Labs/telegraf.git telegraf/.src "${TG_VERSION:-master}"
"""

["telegraf:src:update"]
description = "Fetch and checkout pinned version"
depends = ["telegraf:src:clone", "sync-git:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} fetch telegraf/.src --tags
sync-git/.bin/sync-git${EXE} checkout telegraf/.src "${TG_VERSION:-master}"
"""

["telegraf:bin:build"]
description = "Build telegraf binary"
depends = ["telegraf:src:clone", "sync-git:ensure"]
dir = "telegraf/.src"
env = { GOWORK = "off" }
run_windows = '''
if (Test-Path "../.bin/telegraf.exe") { exit 0 }
New-Item -ItemType Directory -Force -Path "../.bin" | Out-Null
$env:CGO_ENABLED = "0"
go build -o "telegraf.exe" ./cmd/telegraf
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
Copy-Item "telegraf.exe" "../.bin/telegraf.exe"
& "..\..\sync-git\.bin\sync-git.exe" version-file "..\\.bin\\telegraf.exe" --src="..\\.src"
'''
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f ../.bin/telegraf${EXE} ] && exit 0
mkdir -p ../.bin
make build
cp telegraf${EXE} ../.bin/
../../sync-git/.bin/sync-git${EXE} version-file ../.bin/telegraf${EXE} --src=../.src
"""

["telegraf:ensure"]
description = "Ensure telegraf binary exists"
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
[ -f telegraf/.bin/telegraf${EXE} ] && exit 0
mise run telegraf:bin:build
"""

["telegraf:run"]
description = "Run telegraf binary"
depends = ["telegraf:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
mkdir -p telegraf/.data
telegraf/.bin/telegraf${EXE} --config telegraf/telegraf.conf
"""

["telegraf:health"]
description = "Check Telegraf health"
run_windows = 'if (-not (Get-Process telegraf -ErrorAction SilentlyContinue)) { exit 1 }'
run = 'pgrep -f "telegraf --config" > /dev/null'

["telegraf:dev:run"]
description = "Run telegraf from source (development)"
depends = ["telegraf:src:clone"]
dir = "telegraf/.src"
env = { GOWORK = "off" }
run = """
mkdir -p ../.data
go run ./cmd/telegraf --config ../telegraf.conf
"""

["telegraf:config:version"]
description = "Output pinned version"
run = 'echo "${TG_VERSION:-master}"'

["telegraf:deps"]
description = "Download dependencies"
depends = ["telegraf:src:clone"]
dir = "telegraf/.src"
env = { GOWORK = "off" }
run = "go mod download"

["telegraf:test"]
description = "Run tests"
depends = ["telegraf:src:clone"]
dir = "telegraf/.src"
env = { GOWORK = "off" }
run = "make test"

["telegraf:package"]
description = "Package binary for release"
run = """
#!/usr/bin/env bash
set -euo pipefail
GOOS="${GOOS:-$(go env GOOS)}"
GOARCH="${GOARCH:-$(go env GOARCH)}"
DIST="${DIST:-$DIST_DIR}"
EXE=$(go env GOEXE)
mkdir -p "$DIST"
if [ "$GOOS" = "windows" ]; then
  ouch compress -y "telegraf/.bin/telegraf${EXE}" "$DIST/telegraf-${GOOS}-${GOARCH}.zip"
else
  ouch compress -y "telegraf/.bin/telegraf${EXE}" "$DIST/telegraf-${GOOS}-${GOARCH}.tar.gz"
fi
"""

["telegraf:clean"]
description = "Clean build artifacts"
run = "rm -rf telegraf/.bin"

["telegraf:clean:all"]
description = "Clean everything"
run = "rm -rf telegraf/.src telegraf/.bin telegraf/.data"

["telegraf:clean:data"]
description = "Clean data directory"
run = "rm -rf telegraf/.data"

["telegraf:clean:src"]
description = "Clean source directory"
run = "rm -rf telegraf/.src"
