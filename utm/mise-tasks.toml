# ── Diagnostics ───────────────────────────────────────────────────────────────

["utm:diag:utmctl"]
description = "List all VMs known to utmctl (the running UTM process)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
echo "=== utmctl list (what UTM process sees) ==="
utmctl list 2>/dev/null || echo "  (utmctl failed — is UTM running?)"
"""

["utm:diag:registry"]
description = "List all entries in UTM registry via defaults read (UUID → name, path, exists)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
PREFS=~/Library/Containers/com.utmapp.UTM/Data/Library/Preferences/com.utmapp.UTM.plist
echo "=== UTM registry (via defaults read — always current) ==="
# defaults read goes through cfprefsd — no binary data, always reflects live state
UUIDS=$(defaults read com.utmapp.UTM Registry 2>/dev/null \
  | grep -oE '"[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}" =' \
  | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
if [ -z "$UUIDS" ]; then
  echo "  (registry is empty)"
  exit 0
fi
# For each UUID, read specific string keys from plist (no binary data at leaf level)
for uuid in $UUIDS; do
  BUNDLE=$(/usr/libexec/PlistBuddy -c "Print Registry:${uuid}:Package:Path" "$PREFS" 2>/dev/null || echo "(no path)")
  NAME=$(/usr/libexec/PlistBuddy -c "Print Registry:${uuid}:Name" "$PREFS" 2>/dev/null || echo "(no name)")
  if [ -e "$BUNDLE" ]; then EXISTS="EXISTS"; else EXISTS="MISSING"; fi
  echo "  $uuid  $EXISTS  name=$NAME  $BUNDLE"
done
"""

["utm:diag:bundles"]
description = "List all .utm bundles in UTM Documents folder"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
BASE=~/Library/Containers/com.utmapp.UTM/Data/Documents
echo "=== .utm bundles on disk ($BASE) ==="
if [ ! -d "$BASE" ]; then
  echo "  (directory not found)"
  exit 0
fi
COUNT=0
for bundle in "$BASE"/*.utm; do
  [ -e "$bundle" ] || { echo "  (none found)"; break; }
  NAME=$(basename "$bundle")
  # Try to read UUID from config.plist inside bundle
  UUID=$(/usr/libexec/PlistBuddy -c "Print Information:UUID" "$bundle/config.plist" 2>/dev/null || echo "(no uuid)")
  echo "  $NAME  uuid=$UUID"
  COUNT=$((COUNT+1))
done
echo "  total: $COUNT bundle(s)"
"""

["utm:diag:vagrant"]
description = "List vagrant machine state in .vagrant/machines/"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
VAGRANT_DIR="$(pwd)/utm"
echo "=== Vagrant local machine state ($VAGRANT_DIR/.vagrant/machines/) ==="
if [ ! -d "$VAGRANT_DIR/.vagrant/machines" ]; then
  echo "  (no .vagrant/machines found)"
  exit 0
fi
for machine_dir in "$VAGRANT_DIR/.vagrant/machines"/*/utm; do
  [ -d "$machine_dir" ] || continue
  VM_NAME=$(basename "$(dirname "$machine_dir")")
  ID_FILE="$machine_dir/id"
  if [ -f "$ID_FILE" ]; then
    UUID=$(cat "$ID_FILE")
    echo "  $VM_NAME  vagrant-uuid=$UUID"
  else
    echo "  $VM_NAME  (no id file)"
  fi
done
"""

["utm:diag:vagrant:global"]
description = "List vagrant global machine index (~/.vagrant.d/data/machine-index/index)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
INDEX=~/.vagrant.d/data/machine-index/index
echo "=== Vagrant global machine index ($INDEX) ==="
if [ ! -f "$INDEX" ]; then
  echo "  (index not found)"
  exit 0
fi
# Use jq (/usr/bin/jq) — vagrant index is pretty-printed JSON, grep-based parsing breaks on multiline
if [ ! -s "$INDEX" ] || /usr/bin/jq -e '.machines | length == 0' "$INDEX" >/dev/null 2>&1; then
  echo "  (index is empty)"
  exit 0
fi
/usr/bin/jq -r '.machines | to_entries[] | "  id=" + .key + "  name=" + (.value.name // "") + "  state=" + (.value.state // "") + "  path=" + (.value.vagrantfile_path // "")' "$INDEX" 2>/dev/null || echo "  (could not parse index)"
"""

["utm:diag"]
description = "Run all UTM diagnostics (utmctl + registry + bundles + vagrant state)"
depends = ["utm:diag:utmctl", "utm:diag:registry", "utm:diag:bundles", "utm:diag:vagrant", "utm:diag:vagrant:global"]
run = ""

# ── Clean ─────────────────────────────────────────────────────────────────────

["utm:clean"]
description = "Destroy all UTM VMs via vagrant (best-effort)"
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
vagrant destroy -f 2>/dev/null || echo "WARN vagrant destroy failed — run utm:clean:registry to force clean"
"""

["utm:clean:all"]
description = "Destroy all VMs, remove all boxes, and clean registry"
depends = ["utm:clean:registry", "utm:box:clean"]
run = ""

["utm:clean:registry"]
description = "Remove all orphaned UTM VM bundles and stale registry entries (use when UTM is in a bad state)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
pkill -x UTM 2>/dev/null || true
sleep 5
# Wait until UTM is fully gone before touching registry
while pgrep -x UTM >/dev/null 2>&1; do sleep 1; done
BASE=~/Library/Containers/com.utmapp.UTM/Data/Documents
PREFS=~/Library/Containers/com.utmapp.UTM/Data/Library/Preferences/com.utmapp.UTM.plist
VAGRANT_DIR="$(pwd)/utm"

echo "=== Reconciling UTM registry (removing entries with missing bundles) ==="
if [ -f "$PREFS" ]; then
  # UTM is stopped — read plist file directly, use strings to strip binary Bookmark data
  # Match only top-level registry dict keys (UUID = Dict pattern)
  UUIDS=$(/usr/libexec/PlistBuddy -c "Print Registry" "$PREFS" 2>/dev/null | strings \
    | grep -E '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12} = Dict' \
    | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
  for uuid in $UUIDS; do
    BUNDLE=$(/usr/libexec/PlistBuddy -c "Print Registry:${uuid}:Package:Path" "$PREFS" 2>/dev/null || true)
    if [ -z "$BUNDLE" ]; then continue; fi
    if [ ! -e "$BUNDLE" ]; then
      /usr/libexec/PlistBuddy -c "Delete Registry:${uuid}" "$PREFS"
      echo "  removed stale: $uuid ($(basename "$BUNDLE"))"
    else
      echo "  kept valid:    $uuid ($(basename "$BUNDLE"))"
    fi
  done
fi

echo "=== Clearing vagrant machine state ==="
rm -rf "$VAGRANT_DIR/.vagrant/machines"

echo "=== Clearing vagrant global machine index ==="
INDEX=~/.vagrant.d/data/machine-index/index
if [ -f "$INDEX" ]; then
  echo '{"version":1,"machines":{}}' > "$INDEX"
  echo "  reset vagrant global index"
fi

echo "OK UTM registry cleaned — run VM=windows mise run utm:up to start fresh"
"""

# ── Packer (custom box build) ─────────────────────────────────────────────────

["utm:packer:init"]
description = "Install Packer plugins for UTM (utm-iso source + utm-vagrant post-processor)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
packer init utm/windows.pkr.hcl
echo "OK packer plugins installed"
"""

["utm:packer:validate"]
description = "Validate windows.pkr.hcl (requires ISO_URL env var)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
if [ -z "${ISO_URL:-}" ]; then
  echo "FAIL ISO_URL is required — e.g. ISO_URL=/path/to/windows.iso mise run utm:packer:validate"
  exit 1
fi
packer validate -var "iso_url=${ISO_URL}" utm/windows.pkr.hcl
echo "OK windows.pkr.hcl is valid"
"""

["utm:packer:build"]
description = "Build custom Windows 11 ARM64 Vagrant box via Packer (requires ISO_URL env var)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
if [ -z "${ISO_URL:-}" ]; then
  echo "FAIL ISO_URL is required — e.g. ISO_URL=/path/to/windows.iso mise run utm:packer:build"
  echo "  Download ISO from: https://www.microsoft.com/software-download/windowsinsiderpreviewiso"
  exit 1
fi
echo "Building Windows 11 ARM64 box from ISO: ${ISO_URL}"
packer build -var "iso_url=${ISO_URL}" utm/windows.pkr.hcl
echo "OK Box built: utm/windows-11-arm64.box"
echo "  Add to Vagrant: vagrant box add utm/windows-11 utm/windows-11-arm64.box --provider utm"
"""
