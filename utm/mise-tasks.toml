# ── Windows (WinRM-specific) ──────────────────────────────────────────────────

["utm:windows:ci"]
description = "Run 'mise run ci' inside the Windows VM"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
VM=windows mise run utm:up
echo "Waiting for WinRM to become available..."
# utmctl start returns immediately; Windows takes ~2 min to boot to WinRM
for i in $(seq 1 24); do
  if vagrant winrm -s powershell -c 'exit 0' windows 2>/dev/null; then
    echo "OK WinRM ready"
    break
  fi
  echo "  waiting... ($i/24)"
  sleep 10
done
echo "Running 'mise run ci' inside Windows VM..."
# Use vagrant winrm (not vagrant provision) — vagrant provision destroys the VM
# on WinRM failure; vagrant winrm just returns exit code with no VM lifecycle cleanup.
vagrant winrm -s powershell -c "
  Set-Location 'C:\\plat-telemetry\\utm'
  & .\\windows-ci.ps1
" windows
echo "OK Windows CI passed"
"""

