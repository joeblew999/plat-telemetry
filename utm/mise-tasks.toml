# ── Box Management ────────────────────────────────────────────────────────────

["utm:box:download"]
description = "Pre-download all Vagrant boxes for UTM (ubuntu, debian, alpine, windows)"
depends = ["utm:ensure"]
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
for box in utm/ubuntu-24.04 utm/bookworm utm/alpine-ce utm/windows-11; do
  if vagrant box list 2>/dev/null | grep -q "^${box} "; then
    echo "OK $box already downloaded"
  else
    echo "Downloading $box..."
    vagrant box add "$box" --provider utm
  fi
done
echo "OK all boxes ready"
"""

["utm:box:list"]
description = "List downloaded Vagrant boxes"
depends = ["utm:ensure"]
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
vagrant box list
"""

["utm:box:clean"]
description = "Remove all downloaded Vagrant boxes"
depends = ["utm:ensure"]
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
for box in utm/ubuntu-24.04 utm/bookworm utm/alpine-ce utm/windows-11; do
  vagrant box remove "$box" --provider utm --force 2>/dev/null || true
done
echo "OK boxes removed"
"""

# ── Windows (WinRM-specific) ──────────────────────────────────────────────────

["utm:windows:ci"]
description = "Run 'mise run ci' inside the Windows VM"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
vagrant status windows 2>/dev/null | grep -q "running" || vagrant up windows
echo "Running 'mise run ci' inside Windows VM..."
# Uses windows-ci.ps1 via the 'ci' provisioner (non-privileged, sets PATH for bash)
# Vagrantfile reads DOPPLER_TOKEN from host env and passes it to the VM
# Set DOPPLER_TOKEN in .env or run: DOPPLER_TOKEN=$(doppler configs tokens create ci --plain) mise run utm:windows:ci
vagrant provision windows --provision-with ci
echo "OK Windows CI passed"
"""

["utm:windows:shell"]
description = "Open an interactive WinRM PowerShell session in the Windows VM"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
vagrant winrm -s powershell windows
"""

# ── Clean ─────────────────────────────────────────────────────────────────────

["utm:clean"]
description = "Destroy all UTM VMs"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
vagrant destroy -f
"""

["utm:clean:all"]
description = "Destroy all VMs and remove all boxes"
depends = ["utm:clean", "utm:box:clean"]
run = ""

["utm:clean:registry"]
description = "Remove all orphaned UTM VM bundles and stale registry entries (use when UTM is in a bad state)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
pkill -x UTM 2>/dev/null || true
sleep 2
BASE=~/Library/Containers/com.utmapp.UTM/Data/Documents
PREFS=~/Library/Containers/com.utmapp.UTM/Data/Library/Preferences/com.utmapp.UTM.plist
VAGRANT_DIR="$(cd "$(dirname "$0")" && pwd)"

echo "=== Removing all plat-* and packer-vm-* VM bundles ==="
for bundle in "$BASE"/plat-windows.utm "$BASE"/plat-ubuntu.utm "$BASE"/plat-debian.utm "$BASE"/plat-alpine.utm "$BASE"/packer-vm-*.utm; do
  [ -e "$bundle" ] || continue
  echo "  removing $bundle"
  rm -rf "$bundle"
done

echo "=== Clearing UTM registry entries ==="
if [ -f "$PREFS" ]; then
  for uuid in $(plutil -p "$PREFS" 2>/dev/null | grep '"UUID"' | sed 's/.*=> "\\(.*\\)"/\\1/' 2>/dev/null || true); do
    plutil -remove "Registry.$uuid" "$PREFS" 2>/dev/null && echo "  removed $uuid" || true
  done
fi

echo "=== Clearing vagrant machine state ==="
rm -rf "$VAGRANT_DIR/.vagrant/machines"

echo "=== Clearing vagrant global machine index ==="
INDEX=~/.vagrant.d/data/machine-index/index
if [ -f "$INDEX" ]; then
  python3 -c "
import json
with open('$INDEX') as f: data = json.load(f)
to_remove = [k for k,v in data.get('machines',{}).items() if 'plat-telemetry' in v.get('vagrantfile_path','')]
for k in to_remove: del data['machines'][k]
with open('$INDEX','w') as f: json.dump(data, f, indent=2)
import sys; print(f'removed {len(to_remove)} entries', file=sys.stderr)
"
fi

open -a UTM
echo "OK UTM registry cleaned — run VM=windows mise run utm:up to start fresh"
"""

# ── Packer (custom box build) ─────────────────────────────────────────────────

["utm:packer:init"]
description = "Install Packer plugins for UTM (utm-iso source + utm-vagrant post-processor)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
packer init utm/windows.pkr.hcl
echo "OK packer plugins installed"
"""

["utm:packer:validate"]
description = "Validate windows.pkr.hcl (requires ISO_URL env var)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
if [ -z "${ISO_URL:-}" ]; then
  echo "FAIL ISO_URL is required — e.g. ISO_URL=/path/to/windows.iso mise run utm:packer:validate"
  exit 1
fi
packer validate -var "iso_url=${ISO_URL}" utm/windows.pkr.hcl
echo "OK windows.pkr.hcl is valid"
"""

["utm:packer:build"]
description = "Build custom Windows 11 ARM64 Vagrant box via Packer (requires ISO_URL env var)"
run_windows = 'Write-Host "SKIP utm:packer: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm:packer: UTM is macOS-only"
  exit 0
fi
if [ -z "${ISO_URL:-}" ]; then
  echo "FAIL ISO_URL is required — e.g. ISO_URL=/path/to/windows.iso mise run utm:packer:build"
  echo "  Download ISO from: https://www.microsoft.com/software-download/windowsinsiderpreviewiso"
  exit 1
fi
echo "Building Windows 11 ARM64 box from ISO: ${ISO_URL}"
packer build -var "iso_url=${ISO_URL}" utm/windows.pkr.hcl
echo "OK Box built: utm/windows-11-arm64.box"
echo "  Add to Vagrant: vagrant box add utm/windows-11 utm/windows-11-arm64.box --provider utm"
"""
