# UTM - VM lifecycle via Vagrant + UTM on macOS ARM64
# Goal: boot Windows 11 ARM64 VM and run `mise run ci` to validate cross-platform compatibility
# All tasks skip gracefully on non-macOS (UTM is macOS-only)
# Usage: VM=<name> mise run utm:<task>  (e.g. VM=alpine mise run utm:up)
#
# Platform handling:
#   run         = bash script for macOS (and Linux, which also guards via uname check)
#   run_windows = PowerShell no-op — mise handles the skip at the framework level,
#                 so bash never needs to be on PATH for Windows to use these tasks

# ── Dependencies ──────────────────────────────────────────────────────────────

["utm:deps"]
description = "Verify UTM + Vagrant are installed, install vagrant_utm plugin"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if ! command -v utmctl >/dev/null 2>&1 && [ ! -d "/Applications/UTM.app" ]; then
  echo "FAIL UTM not installed"
  echo "  Install from: https://mac.getutm.app"
  exit 1
fi
echo "OK UTM found"
if ! command -v vagrant >/dev/null 2>&1; then
  echo "FAIL Vagrant not installed"
  echo "  Run in your terminal: brew install --cask vagrant"
  echo "  Or download from: https://developer.hashicorp.com/vagrant/install"
  exit 1
fi
echo "OK Vagrant: $(vagrant --version)"
if vagrant plugin list 2>/dev/null | grep -q vagrant_utm; then
  echo "OK vagrant_utm plugin already installed"
else
  echo "Installing vagrant_utm plugin..."
  vagrant plugin install vagrant_utm
fi
echo "OK utm deps ready"
"""

["utm:ensure"]
description = "Verify UTM prerequisites are met (quick check)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
command -v vagrant >/dev/null 2>&1 || { echo "FAIL vagrant not found — run: mise run utm:deps"; exit 1; }
vagrant plugin list 2>/dev/null | grep -q vagrant_utm || { echo "FAIL vagrant_utm plugin missing — run: mise run utm:deps"; exit 1; }
echo "OK utm prerequisites met"
"""

# ── VM Lifecycle ──────────────────────────────────────────────────────────────

["utm:up"]
description = "Start a UTM VM (VM=ubuntu|debian|alpine|windows)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -z "${VM:-}" ]; then
  echo "FAIL VM is required — e.g. VM=alpine mise run utm:up"
  exit 1
fi
# Import, configure ports/memory/cpu (may fail on start — that is OK for windows)
vagrant up "$VM" || true

# Windows: patch config.plist before starting — the box ships with virtio-ramfb-gl
# which crashes UTM on macOS 26+, and vagrant adds VirtFS args we don't need.
if [ "$VM" = "windows" ]; then
  UUID=$(cat .vagrant/machines/windows/utm/id 2>/dev/null || true)
  if [ -z "$UUID" ]; then
    echo "FAIL could not read windows VM UUID from vagrant state"
    exit 1
  fi
  CONFIG=~/Library/Containers/com.utmapp.UTM/Data/Documents/plat-windows.utm/config.plist
  if [ ! -f "$CONFIG" ]; then
    echo "FAIL config.plist not found at $CONFIG"
    exit 1
  fi
  # Find the bundle path from UTM's registry (vagrant creates packer-vm-XXXXX.utm, not plat-windows.utm)
  PREFS=~/Library/Containers/com.utmapp.UTM/Data/Library/Preferences/com.utmapp.UTM.plist
  CONFIG=$(plutil -p "$PREFS" 2>/dev/null | grep -A3 "$UUID" | grep '"Path"' | sed 's/.*=> "\\(.*\\)"/\\1/' | head -1)/config.plist
  if [ ! -f "$CONFIG" ]; then
    echo "FAIL could not find config.plist for UUID $UUID"
    exit 1
  fi
  echo "Patching Windows VM config at $CONFIG ..."
  pkill -x UTM 2>/dev/null || true
  sleep 3
  plutil -replace Display.0.Hardware -string "virtio-ramfb" "$CONFIG"
  plutil -remove QEMU.AdditionalArguments "$CONFIG" 2>/dev/null || true
  echo "OK config patched"
  open -a UTM
  sleep 6
  utmctl start "$UUID"
  sleep 5
  utmctl status "$UUID"
fi
"""

["utm:down"]
description = "Stop a UTM VM (VM=name)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -z "${VM:-}" ]; then
  echo "FAIL VM is required — e.g. VM=alpine mise run utm:down"
  exit 1
fi
vagrant halt "$VM"
"""

