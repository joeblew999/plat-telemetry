# ── Diagnostics ───────────────────────────────────────────────────────────────

["utm:diag:utmctl"]
description = "List all VMs known to utmctl (the running UTM process)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
echo "=== utmctl list (what UTM process sees) ==="
utmctl list 2>/dev/null || echo "  (utmctl failed — is UTM running?)"
"""

["utm:diag:registry"]
description = "List all entries in UTM registry via defaults read (UUID → name, path, exists)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
PREFS=~/Library/Containers/com.utmapp.UTM/Data/Library/Preferences/com.utmapp.UTM.plist
echo "=== UTM registry (via defaults read — always current) ==="
# defaults read goes through cfprefsd — no binary data, always reflects live state
UUIDS=$(defaults read com.utmapp.UTM Registry 2>/dev/null \
  | grep -oE '"[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}" =' \
  | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' || true)
if [ -z "$UUIDS" ]; then
  echo "  (registry is empty)"
  exit 0
fi
# For each UUID, read specific string keys from plist (no binary data at leaf level)
for uuid in $UUIDS; do
  BUNDLE=$(/usr/libexec/PlistBuddy -c "Print Registry:${uuid}:Package:Path" "$PREFS" 2>/dev/null || echo "(no path)")
  NAME=$(/usr/libexec/PlistBuddy -c "Print Registry:${uuid}:Name" "$PREFS" 2>/dev/null || echo "(no name)")
  if [ -e "$BUNDLE" ]; then EXISTS="EXISTS"; else EXISTS="MISSING"; fi
  echo "  $uuid  $EXISTS  name=$NAME  $BUNDLE"
done
"""

["utm:diag:bundles"]
description = "List all .utm bundles in UTM Documents folder"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
BASE=~/Library/Containers/com.utmapp.UTM/Data/Documents
echo "=== .utm bundles on disk ($BASE) ==="
if [ ! -d "$BASE" ]; then
  echo "  (directory not found)"
  exit 0
fi
COUNT=0
for bundle in "$BASE"/*.utm; do
  [ -e "$bundle" ] || { echo "  (none found)"; break; }
  NAME=$(basename "$bundle")
  # Try to read UUID from config.plist inside bundle
  UUID=$(/usr/libexec/PlistBuddy -c "Print Information:UUID" "$bundle/config.plist" 2>/dev/null || echo "(no uuid)")
  echo "  $NAME  uuid=$UUID"
  COUNT=$((COUNT+1))
done
echo "  total: $COUNT bundle(s)"
"""

["utm:diag:vagrant"]
description = "List vagrant machine state in .vagrant/machines/"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
VAGRANT_DIR="$(pwd)/utm"
echo "=== Vagrant local machine state ($VAGRANT_DIR/.vagrant/machines/) ==="
if [ ! -d "$VAGRANT_DIR/.vagrant/machines" ]; then
  echo "  (no .vagrant/machines found)"
  exit 0
fi
for machine_dir in "$VAGRANT_DIR/.vagrant/machines"/*/utm; do
  [ -d "$machine_dir" ] || continue
  VM_NAME=$(basename "$(dirname "$machine_dir")")
  ID_FILE="$machine_dir/id"
  if [ -f "$ID_FILE" ]; then
    UUID=$(cat "$ID_FILE")
    echo "  $VM_NAME  vagrant-uuid=$UUID"
  else
    echo "  $VM_NAME  (no id file)"
  fi
done
"""

["utm:diag:vagrant:global"]
description = "List vagrant global machine index (~/.vagrant.d/data/machine-index/index)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
INDEX=~/.vagrant.d/data/machine-index/index
echo "=== Vagrant global machine index ($INDEX) ==="
if [ ! -f "$INDEX" ]; then
  echo "  (index not found)"
  exit 0
fi
# Use PlistBuddy? No — vagrant index is JSON. Use /usr/bin/python3 if available? No.
# Read it with bash + grep — extract machine IDs and their vagrantfile_path
grep -o '"[0-9a-f]*":{[^}]*}' "$INDEX" 2>/dev/null | while IFS= read -r entry; do
  ID=$(echo "$entry" | grep -o '^"[^"]*"' | tr -d '"')
  NAME=$(echo "$entry" | grep -o '"name":"[^"]*"' | cut -d'"' -f4)
  VF_PATH=$(echo "$entry" | grep -o '"vagrantfile_path":"[^"]*"' | cut -d'"' -f4)
  STATE=$(echo "$entry" | grep -o '"state":"[^"]*"' | cut -d'"' -f4)
  echo "  id=$ID  name=$NAME  state=$STATE  path=$VF_PATH"
done || echo "  (could not parse index)"
"""

["utm:diag"]
description = "Run all UTM diagnostics (utmctl + registry + bundles + vagrant state)"
depends = ["utm:diag:utmctl", "utm:diag:registry", "utm:diag:bundles", "utm:diag:vagrant", "utm:diag:vagrant:global"]
run = ""

