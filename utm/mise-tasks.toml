# UTM - VM lifecycle via Vagrant + UTM on macOS ARM64
# Goal: boot VMs and run `mise run ci` to validate cross-platform compatibility
# All tasks skip gracefully on non-macOS (UTM is macOS-only)
# Usage: VM=<name> mise run utm:<task>  (e.g. VM=alpine mise run utm:up)
#
# ── Architecture ──────────────────────────────────────────────────────────────
#
# There are 5 sources of truth that must stay consistent:
#   1. utmctl list          — what the running UTM process knows (UUID, status, name)
#   2. UTM plist registry   — persistent registry in com.utmapp.UTM preferences
#   3. .utm bundles on disk — the actual VM bundle files in ~/Library/.../Documents/
#   4. vagrant local state  — .vagrant/machines/<VM>/utm/id  (UUID file)
#   5. vagrant global index — ~/.vagrant.d/data/machine-index/index (JSON)
#
# Run `mise run utm:diag` at any time to see all 5 sources side-by-side.
# Run `mise run utm:clean:registry` to reconcile when they get out of sync.
#
# ── State restore (utm:state:restore) ─────────────────────────────────────────
#
# vagrant local state (#4) gets wiped by utm:clean:registry to force a fresh
# start. But the UTM VM (#1,#2,#3) still exists. Without the vagrant id file,
# all vagrant commands fail ("VM not found"). utm:state:restore detects this
# and rebuilds the id file from utmctl list before any lifecycle task runs.
# All lifecycle tasks (up/down/destroy/provision/reload) depend on it.
#
# ── Registry parsing ──────────────────────────────────────────────────────────
#
# The UTM plist contains binary NSData (Bookmark fields) which breaks grep.
# For the diag (UTM running): use `defaults read com.utmapp.UTM Registry`
#   — goes through cfprefsd, always current, plain text output.
# For clean:registry (UTM stopped): use PlistBuddy + strings to strip binary,
#   then match "UUID = Dict {" lines which are actual registry keys.
# Never grep PlistBuddy's full Registry dump directly — the Bookmark binary
#   data contains UUID-like strings that cause false positives.
#
# ── Platform handling ─────────────────────────────────────────────────────────
#   run         = bash script for macOS (and Linux, which also guards via uname check)
#   run_windows = PowerShell no-op — mise handles the skip at the framework level

# ── Dependencies ──────────────────────────────────────────────────────────────

["utm:deps"]
description = "Install UTM, Vagrant, and vagrant_utm plugin"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -d "/Applications/UTM.app" ] || command -v utmctl >/dev/null 2>&1; then
  echo "OK UTM already installed"
else
  echo "Installing UTM..."
  brew install --cask utm
  pkill -x UTM 2>/dev/null || true  # kill if brew auto-launched it
  echo "OK UTM installed"
fi
if command -v vagrant >/dev/null 2>&1; then
  echo "OK Vagrant already installed: $(vagrant --version)"
else
  echo "Installing Vagrant..."
  # Vagrant installs via pkg inside dmg — requires admin (prompts via macOS dialog)
  brew fetch --cask vagrant 2>/dev/null || true
  DMG=$(find ~/Library/Caches/Homebrew/Cask -name "vagrant_*.dmg" 2>/dev/null | head -1)
  if [ -z "$DMG" ]; then
    echo "FAIL could not find vagrant dmg in brew cache"
    exit 1
  fi
  hdiutil detach /Volumes/Vagrant -quiet 2>/dev/null || true  # detach if already mounted
  hdiutil attach "$DMG" -nobrowse -quiet
  osascript -e 'do shell script "installer -pkg /Volumes/Vagrant/vagrant.pkg -target /" with administrator privileges'
  hdiutil detach /Volumes/Vagrant -quiet 2>/dev/null || true
  echo "OK Vagrant installed: $(vagrant --version)"
fi
if vagrant plugin list 2>/dev/null | grep -q vagrant_utm; then
  echo "OK vagrant_utm plugin already installed"
else
  echo "Installing vagrant_utm plugin..."
  vagrant plugin install vagrant_utm
  echo "OK vagrant_utm plugin installed"
fi
echo "OK utm deps ready"
"""

["utm:deps:delete"]
description = "Uninstall vagrant_utm plugin, Vagrant, and UTM app"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
pkill -x UTM 2>/dev/null || true
pkill -x Vagrant 2>/dev/null || true

# 1. Remove plugin first (requires vagrant still installed)
if command -v vagrant >/dev/null 2>&1 && vagrant plugin list 2>/dev/null | grep -q vagrant_utm; then
  vagrant plugin uninstall vagrant_utm && echo "OK vagrant_utm plugin removed" || echo "WARN vagrant_utm plugin remove failed"
else
  echo "OK vagrant_utm plugin not installed"
fi

# 2. Remove Vagrant (pkg install requires admin — prompts via macOS dialog)
if [ -d "/opt/vagrant" ] || command -v vagrant >/dev/null 2>&1; then
  osascript -e 'do shell script "rm -rf /opt/vagrant && rm -f /usr/local/bin/vagrant && pkgutil --forget com.vagrant.vagrant" with administrator privileges'
  brew uninstall --cask vagrant 2>/dev/null || true
  echo "OK Vagrant removed"
else
  echo "OK Vagrant not installed"
fi

# 3. Remove UTM
if [ -d "/Applications/UTM.app" ] || command -v utmctl >/dev/null 2>&1; then
  brew uninstall --cask utm && echo "OK UTM removed" || echo "WARN UTM remove failed"
else
  echo "OK UTM not installed"
fi

echo "OK utm deps delete done"
"""

["utm:ensure"]
description = "Verify UTM prerequisites are met (quick check)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
command -v vagrant >/dev/null 2>&1 || { echo "FAIL vagrant not found — run: mise run utm:deps"; exit 1; }
vagrant plugin list 2>/dev/null | grep -q vagrant_utm || { echo "FAIL vagrant_utm plugin missing — run: mise run utm:deps"; exit 1; }
echo "OK utm prerequisites met"
"""

# ── VM Lifecycle ──────────────────────────────────────────────────────────────

["utm:state:restore"]
description = "Restore vagrant local state from UTM if missing (VM=name required)"
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then exit 0; fi
if [ -z "${VM:-}" ]; then echo "FAIL VM is required"; exit 1; fi
UUID=$(cat ".vagrant/machines/${VM}/utm/id" 2>/dev/null || true)
if [ -z "$UUID" ]; then
  UUID=$(utmctl list 2>/dev/null | grep "plat-${VM}" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1 || true)
  if [ -n "$UUID" ]; then
    mkdir -p ".vagrant/machines/${VM}/utm"
    echo -n "$UUID" > ".vagrant/machines/${VM}/utm/id"
    echo "OK restored vagrant state uuid=$UUID"
  fi
fi
"""

["utm:up"]
description = "Start a UTM VM (VM=ubuntu|debian|alpine|windows)"
depends = ["utm:ensure", "utm:state:restore"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -z "${VM:-}" ]; then
  echo "FAIL VM is required — e.g. VM=alpine mise run utm:up"
  exit 1
fi
UUID=$(cat ".vagrant/machines/${VM}/utm/id" 2>/dev/null || true)
if [ -n "$UUID" ]; then
  STATUS=$(utmctl status "$UUID" 2>/dev/null || true)
  echo "OK vagrant UUID=$UUID status=$STATUS"
  if [ "$STATUS" = "started" ]; then
    echo "OK VM already running"
    exit 0
  fi
  if [ "$STATUS" = "stopped" ]; then
    echo "Starting existing VM..."
    # utmctl start can fail with -609 (XPC connection invalid) after a force-kill.
    # Fix: gracefully quit UTM (not pkill -9 which leaves XPC broken), restart, then start.
    if ! utmctl start "$UUID" 2>/dev/null; then
      echo "WARN utmctl start failed (XPC -609), restarting UTM gracefully..."
      osascript -e 'tell application "UTM" to quit' 2>/dev/null || pkill -x UTM 2>/dev/null || true
      sleep 5
      open -a UTM
      sleep 15
      utmctl start "$UUID"
    fi
    exit 0
  fi
fi

# No vagrant state and no UTM VM — create from scratch
vagrant up "$VM"
"""

["utm:down"]
description = "Stop a UTM VM (VM=name)"
depends = ["utm:ensure", "utm:state:restore"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -z "${VM:-}" ]; then
  echo "FAIL VM is required — e.g. VM=alpine mise run utm:down"
  exit 1
fi
UUID=$(cat ".vagrant/machines/${VM}/utm/id" 2>/dev/null || true)
if [ -n "$UUID" ]; then
  utmctl stop "$UUID" 2>/dev/null || true
  echo "OK VM stopped uuid=$UUID"
else
  vagrant halt "$VM" 2>/dev/null || echo "WARN could not stop VM — may already be stopped"
fi
"""

["utm:wait"]
description = "Wait until all builds/installs finish inside the VM (VM=name)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then echo "SKIP utm: UTM is macOS-only"; exit 0; fi
if [ -z "${VM:-}" ]; then echo "FAIL VM is required — e.g. VM=windows mise run utm:wait"; exit 1; fi
echo "Waiting for all builds/installs to finish in VM=$VM ..."
while true; do
  if [ "$VM" = "windows" ]; then
    PS='Get-Process | Where-Object { $_.Name -match "^go$|winget|msiexec" } | Select-Object -ExpandProperty Name | Sort-Object -Unique'
    PROCS=$(vagrant winrm -s powershell -c "$PS" "$VM" 2>/dev/null | tr -d '\r' | grep -v '^$' || true)
  else
    PROCS=$(vagrant ssh "$VM" -c "pgrep -la go 2>/dev/null | grep -vE 'pgrep|sshd|bash|vagrant' || pgrep -la apt 2>/dev/null || pgrep -la apk 2>/dev/null || true" 2>/dev/null | grep -v '^$' || true)
  fi
  if [ -z "$PROCS" ]; then
    echo "OK VM=$VM is idle — all builds/installs done"
    break
  fi
  echo "  still running: $(echo "$PROCS" | tr '\n' ' ') — checking again in 15s..."
  sleep 15
done
"""

["utm:copy:to"]
description = "Copy a file from host to VM (VM=name SRC=local-path DEST=remote-path)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then echo "SKIP utm: UTM is macOS-only"; exit 0; fi
if [ -z "${VM:-}" ]; then echo "FAIL VM is required — e.g. VM=alpine SRC=./file DEST=/tmp/file mise run utm:copy:to"; exit 1; fi
if [ -z "${SRC:-}" ]; then echo "FAIL SRC is required"; exit 1; fi
if [ -z "${DEST:-}" ]; then echo "FAIL DEST is required"; exit 1; fi
if [ "$VM" = "windows" ]; then
  vagrant winrm-upload "$SRC" "$DEST" windows
else
  vagrant upload "$SRC" "$DEST" "$VM"
fi
echo "OK copied $SRC -> $VM:$DEST"
"""

["utm:copy:from"]
description = "Copy a file from VM to host (VM=name SRC=remote-path DEST=local-path)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then echo "SKIP utm: UTM is macOS-only"; exit 0; fi
if [ -z "${VM:-}" ]; then echo "FAIL VM is required — e.g. VM=alpine SRC=/tmp/file DEST=./file mise run utm:copy:from"; exit 1; fi
if [ -z "${SRC:-}" ]; then echo "FAIL SRC is required"; exit 1; fi
if [ -z "${DEST:-}" ]; then echo "FAIL DEST is required"; exit 1; fi
if [ "$VM" = "windows" ]; then
  # WinRM: base64-encode the file inside the VM, decode on host
  B64=$(vagrant winrm -s powershell -c "[Convert]::ToBase64String([IO.File]::ReadAllBytes('$SRC'))" windows 2>/dev/null | tr -d '\r\n')
  echo "$B64" | base64 -d > "$DEST"
else
  # SSH: pipe file contents via vagrant ssh
  vagrant ssh "$VM" -c "cat '$SRC'" > "$DEST"
fi
echo "OK copied $VM:$SRC -> $DEST"
"""

