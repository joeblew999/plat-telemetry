# UTM - VM lifecycle via Vagrant + UTM on macOS ARM64
# Goal: boot Windows 11 ARM64 VM and run `mise run ci` to validate cross-platform compatibility
# All tasks skip gracefully on non-macOS (UTM is macOS-only)
# Usage: VM=<name> mise run utm:<task>  (e.g. VM=alpine mise run utm:up)
#
# Platform handling:
#   run         = bash script for macOS (and Linux, which also guards via uname check)
#   run_windows = PowerShell no-op — mise handles the skip at the framework level,
#                 so bash never needs to be on PATH for Windows to use these tasks

# ── Dependencies ──────────────────────────────────────────────────────────────

["utm:deps"]
description = "Install UTM, Vagrant, and vagrant_utm plugin"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -d "/Applications/UTM.app" ] || command -v utmctl >/dev/null 2>&1; then
  echo "OK UTM already installed"
else
  echo "Installing UTM..."
  brew install --cask utm
  pkill -x UTM 2>/dev/null || true  # kill if brew auto-launched it
  echo "OK UTM installed"
fi
if command -v vagrant >/dev/null 2>&1; then
  echo "OK Vagrant already installed: $(vagrant --version)"
else
  echo "Installing Vagrant..."
  # Vagrant installs via pkg inside dmg — requires admin (prompts via macOS dialog)
  brew fetch --cask vagrant 2>/dev/null || true
  DMG=$(find ~/Library/Caches/Homebrew/Cask -name "vagrant_*.dmg" 2>/dev/null | head -1)
  if [ -z "$DMG" ]; then
    echo "FAIL could not find vagrant dmg in brew cache"
    exit 1
  fi
  hdiutil attach "$DMG" -nobrowse -quiet
  osascript -e 'do shell script "installer -pkg /Volumes/Vagrant/vagrant.pkg -target /" with administrator privileges'
  hdiutil detach /Volumes/Vagrant -quiet 2>/dev/null || true
  echo "OK Vagrant installed: $(vagrant --version)"
fi
if vagrant plugin list 2>/dev/null | grep -q vagrant_utm; then
  echo "OK vagrant_utm plugin already installed"
else
  echo "Installing vagrant_utm plugin..."
  vagrant plugin install vagrant_utm
  echo "OK vagrant_utm plugin installed"
fi
echo "OK utm deps ready"
"""

["utm:deps:delete"]
description = "Uninstall vagrant_utm plugin, Vagrant, and UTM app"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
pkill -x UTM 2>/dev/null || true
pkill -x Vagrant 2>/dev/null || true

# 1. Remove plugin first (requires vagrant still installed)
if command -v vagrant >/dev/null 2>&1 && vagrant plugin list 2>/dev/null | grep -q vagrant_utm; then
  vagrant plugin uninstall vagrant_utm && echo "OK vagrant_utm plugin removed" || echo "WARN vagrant_utm plugin remove failed"
else
  echo "OK vagrant_utm plugin not installed"
fi

# 2. Remove Vagrant (pkg install requires admin — prompts via macOS dialog)
if [ -d "/opt/vagrant" ] || command -v vagrant >/dev/null 2>&1; then
  osascript -e 'do shell script "rm -rf /opt/vagrant && rm -f /usr/local/bin/vagrant && pkgutil --forget com.vagrant.vagrant" with administrator privileges'
  brew uninstall --cask vagrant 2>/dev/null || true
  echo "OK Vagrant removed"
else
  echo "OK Vagrant not installed"
fi

# 3. Remove UTM
if [ -d "/Applications/UTM.app" ] || command -v utmctl >/dev/null 2>&1; then
  brew uninstall --cask utm && echo "OK UTM removed" || echo "WARN UTM remove failed"
else
  echo "OK UTM not installed"
fi

echo "OK utm deps delete done"
"""

["utm:ensure"]
description = "Verify UTM prerequisites are met (quick check)"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
command -v vagrant >/dev/null 2>&1 || { echo "FAIL vagrant not found — run: mise run utm:deps"; exit 1; }
vagrant plugin list 2>/dev/null | grep -q vagrant_utm || { echo "FAIL vagrant_utm plugin missing — run: mise run utm:deps"; exit 1; }
echo "OK utm prerequisites met"
"""

# ── VM Lifecycle ──────────────────────────────────────────────────────────────

["utm:up"]
description = "Start a UTM VM (VM=ubuntu|debian|alpine|windows)"
depends = ["utm:ensure"]
dir = "utm"
run_windows = 'Write-Host "SKIP utm: UTM is macOS-only"'
run = """
#!/usr/bin/env bash
set -euo pipefail
if [ "$(uname)" != "Darwin" ]; then
  echo "SKIP utm: UTM is macOS-only"
  exit 0
fi
if [ -z "${VM:-}" ]; then
  echo "FAIL VM is required — e.g. VM=alpine mise run utm:up"
  exit 1
fi

# Check vagrant state first
UUID=$(cat ".vagrant/machines/${VM}/utm/id" 2>/dev/null || true)

if [ -z "$UUID" ]; then
  # No vagrant state — check if UTM already has a VM with matching name
  UUID=$(utmctl list 2>/dev/null | grep "plat-${VM}" | grep -oE '[A-F0-9]{8}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{4}-[A-F0-9]{12}' | head -1 || true)
  if [ -n "$UUID" ]; then
    echo "OK found existing UTM VM uuid=$UUID — restoring vagrant state"
    mkdir -p ".vagrant/machines/${VM}/utm"
    echo -n "$UUID" > ".vagrant/machines/${VM}/utm/id"
  fi
fi

if [ -n "$UUID" ]; then
  STATUS=$(utmctl status "$UUID" 2>/dev/null || true)
  echo "OK vagrant UUID=$UUID status=$STATUS"
  if [ "$STATUS" = "started" ]; then
    echo "OK VM already running"
    exit 0
  fi
  if [ "$STATUS" = "stopped" ]; then
    echo "Starting existing VM..."
    utmctl start "$UUID"
    exit 0
  fi
fi

# No vagrant state and no UTM VM — create from scratch
vagrant up "$VM"
"""

