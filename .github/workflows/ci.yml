name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Run sync job only'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_only)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Sync GitHub state
        run: task ci:sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  build:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.sync_only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      # Same commands as local dev!
      - name: Build binaries
        run: task ci:build

      - name: Run tests
        run: task ci:test

      - name: Package binaries
        run: task ci:package

      - name: Release binaries
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: task ci:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Deploy pages
        run: task ci:pages:deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
