name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes - drives sync job
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Run sync job only'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Sync GitHub state
        run: mise run ci:sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  build:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.sync_only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Build binaries
        run: mise run ci:build
      - name: Run tests
        run: mise run ci:test
      - name: Package binaries
        run: mise run ci:package
      - name: Release binaries
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: mise run ci:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Deploy pages
        run: mise run ci:pages:deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
