name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes - drives sync job
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Run sync job only'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_only)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Sync GitHub state
        run: mise run ci:sync

  build:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.sync_only)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Build binaries
        run: mise run ci:build
        shell: bash
      - name: Run tests
        run: mise run ci:test
        shell: bash
      - name: Package binaries
        run: mise run ci:package
        shell: bash
      - name: Start services (Linux/macOS only)
        if: runner.os != 'Windows'
        run: |
          mise run start &
          sleep 10
          mise run status || true
          mise run stop || true
        shell: bash
      - name: Release binaries
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && runner.os != 'Windows'
        run: mise run ci:release
        shell: bash

  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v2
      - name: Deploy pages
        run: mise run ci:pages:deploy
