# Docs - Hugo static site (build hugo extended from source)

["docs:src:clone"]
description = "Clone Hugo upstream repository"
depends = ["sync-git:ensure"]
run = """
#!/usr/bin/env bash
[ -d docs/.src ] && exit 0
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} clone https://github.com/gohugoio/hugo.git docs/.src "${DOCS_VERSION:-v0.140.2}"
"""

["docs:src:update"]
description = "Fetch and checkout pinned version"
depends = ["docs:src:clone", "sync-git:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} fetch docs/.src --tags
sync-git/.bin/sync-git${EXE} checkout docs/.src "${DOCS_VERSION:-v0.140.2}"
"""

["docs:bin:build"]
description = "Build Hugo extended binary"
depends = ["docs:src:clone", "sync-git:ensure"]
dir = "docs/.src"
env = { GOWORK = "off" }
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f ../.bin/hugo${EXE} ] && exit 0
mkdir -p ../.bin
go build -tags extended -o ../.bin/hugo${EXE} .
../../sync-git/.bin/sync-git${EXE} version-file ../.bin/hugo${EXE} --src=../.src
"""

["docs:bin:download"]
description = "Download pre-built Hugo binary"
depends = ["sync-git:ensure"]
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f docs/.bin/hugo${EXE} ] && exit 0
GOOS="$(go env GOOS)"
GOARCH="$(go env GOARCH)"
VERSION_NUM="${DOCS_VERSION#v}"
mkdir -p docs/.bin
if [ "$GOOS" = "windows" ]; then
  ARCHIVE="hugo_extended_${VERSION_NUM}_${GOOS}-${GOARCH}.zip"
  TMPFILE=$(mktemp)
  curl -L "https://github.com/gohugoio/hugo/releases/download/${DOCS_VERSION}/$ARCHIVE" -o "$TMPFILE"
  unzip -o "$TMPFILE" hugo.exe -d docs/.bin
  rm -f "$TMPFILE"
else
  if [ "$GOOS" = "darwin" ]; then
    ARCHIVE="hugo_extended_${VERSION_NUM}_${GOOS}-universal.tar.gz"
  else
    ARCHIVE="hugo_extended_${VERSION_NUM}_${GOOS}-${GOARCH}.tar.gz"
  fi
  curl -L "https://github.com/gohugoio/hugo/releases/download/${DOCS_VERSION}/$ARCHIVE" | tar xz -C docs/.bin hugo
fi
sync-git/.bin/sync-git${EXE} version-file docs/.bin/hugo${EXE} --version="${DOCS_VERSION}"
"""

["docs:ensure"]
description = "Ensure Hugo binary exists"
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
[ -f docs/.bin/hugo${EXE} ] && exit 0
mise run docs:bin:download
"""

["docs:run"]
description = "Run Hugo dev server"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} server -D --bind 0.0.0.0 --port 1313 -s docs
"""

["docs:health"]
description = "Check Hugo server health"
run = "curl -sf http://localhost:1313/plat-telemetry/ > /dev/null"

["docs:build"]
description = "Build Hugo static site"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} --minify -s docs -d .dist
"""

["docs:test"]
description = "Check Hugo build works"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} --minify -s docs -d .dist
"""

["docs:deps"]
description = "No dependencies for Hugo docs"
run = 'echo "Hugo docs have no dependencies"'

["docs:clean"]
description = "Clean site output"
run = "rm -rf docs/.dist"

["docs:clean:bin"]
description = "Clean Hugo binary"
run = "rm -rf docs/.bin"

["docs:clean:src"]
description = "Clean Hugo source"
run = "rm -rf docs/.src"

["docs:clean:all"]
description = "Clean everything"
run = "rm -rf docs/.src docs/.bin docs/.dist docs/.data docs/.hugo_build.lock"
