# Docs - Hugo static site (build hugo extended from source)

["docs:src:clone"]
description = "Clone Hugo upstream repository"
depends = ["sync-git:ensure"]
run = """
#!/usr/bin/env bash
[ -d docs/.src ] && exit 0
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} clone https://github.com/gohugoio/hugo.git docs/.src "${DOCS_VERSION:-v0.140.2}"
"""

["docs:src:update"]
description = "Fetch and checkout pinned version"
depends = ["docs:src:clone", "sync-git:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
sync-git/.bin/sync-git${EXE} fetch docs/.src --tags
sync-git/.bin/sync-git${EXE} checkout docs/.src "${DOCS_VERSION:-v0.140.2}"
"""

["docs:bin:build"]
description = "Build Hugo extended binary"
depends = ["docs:src:clone", "sync-git:ensure"]
dir = "docs/.src"
env = { GOWORK = "off" }
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f ../.bin/hugo${EXE} ] && exit 0
mkdir -p ../.bin
go build -tags extended -o ../.bin/hugo${EXE} .
../../sync-git/.bin/sync-git${EXE} version-file ../.bin/hugo${EXE} --src=../.src
"""

["docs:bin:download"]
description = "Download pre-built Hugo binary"
depends = ["sync-git:ensure", "gh:ensure"]
run_windows = """
$ErrorActionPreference = "Stop"
$EXE = ".exe"
if (Test-Path "docs/.bin/hugo$EXE") { exit 0 }
$GOOS = (& go env GOOS).Trim()
$GOARCH = (& go env GOARCH).Trim()
$VERSION_NUM = $env:DOCS_VERSION -replace '^v', ''
New-Item -ItemType Directory -Force -Path "docs/.bin" | Out-Null
if ($GOOS -eq "windows") {
  $ARCHIVE = if ($GOARCH -eq "arm64") { "hugo_${VERSION_NUM}_windows-arm64.zip" } else { "hugo_extended_${VERSION_NUM}_windows-amd64.zip" }
} elseif ($GOOS -eq "darwin") {
  $ARCHIVE = "hugo_extended_${VERSION_NUM}_darwin-universal.tar.gz"
} else {
  $ARCHIVE = "hugo_extended_${VERSION_NUM}_${GOOS}-${GOARCH}.tar.gz"
}
gh release download $env:DOCS_VERSION --repo gohugoio/hugo --pattern $ARCHIVE --dir docs/.bin
ouch decompress -y "docs/.bin/$ARCHIVE" --dir docs/.bin
Remove-Item "docs/.bin/$ARCHIVE" -Force
& "sync-git/.bin/sync-git$EXE" version-file "docs/.bin/hugo$EXE" --version=$env:DOCS_VERSION
"""
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f "docs/.bin/hugo${EXE}" ] && exit 0
GOOS="$(go env GOOS)"
GOARCH="$(go env GOARCH)"
VERSION_NUM="${DOCS_VERSION#v}"
mkdir -p docs/.bin
if [ "$GOOS" = "windows" ]; then
  if [ "$GOARCH" = "arm64" ]; then
    ARCHIVE="hugo_${VERSION_NUM}_windows-arm64.zip"
  else
    ARCHIVE="hugo_extended_${VERSION_NUM}_windows-amd64.zip"
  fi
elif [ "$GOOS" = "darwin" ]; then
  ARCHIVE="hugo_extended_${VERSION_NUM}_darwin-universal.tar.gz"
else
  ARCHIVE="hugo_extended_${VERSION_NUM}_${GOOS}-${GOARCH}.tar.gz"
fi
# gh release download works cross-platform (no curl/tar C: path issues on Windows)
gh release download "${DOCS_VERSION}" --repo gohugoio/hugo --pattern "$ARCHIVE" --dir docs/.bin
ouch decompress -y "docs/.bin/$ARCHIVE" --dir docs/.bin
rm -f "docs/.bin/$ARCHIVE"
sync-git/.bin/sync-git${EXE} version-file "docs/.bin/hugo${EXE}" --version="${DOCS_VERSION}"
"""

["docs:ensure"]
description = "Ensure Hugo binary exists"
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
[ -f docs/.bin/hugo${EXE} ] && exit 0
mise run docs:bin:download
"""

["docs:run"]
description = "Run Hugo dev server"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} server -D --bind 0.0.0.0 --port 1313 -s docs
"""

["docs:health"]
description = "Check Hugo server health"
run_windows = 'try { Invoke-WebRequest -Uri "http://localhost:1313/plat-telemetry/" -UseBasicParsing | Out-Null } catch { exit 1 }'
run = "curl -sf http://localhost:1313/plat-telemetry/ > /dev/null"

["docs:build"]
description = "Build Hugo static site"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} --minify -s docs -d .dist
"""

["docs:test"]
description = "Check Hugo build works"
depends = ["docs:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
docs/.bin/hugo${EXE} --minify -s docs -d .dist
"""

["docs:deps"]
description = "No dependencies for Hugo docs"
run = 'echo "Hugo docs have no dependencies"'

["docs:clean"]
description = "Clean site output"
run = "rm -rf docs/.dist"

["docs:clean:bin"]
description = "Clean Hugo binary"
run = "rm -rf docs/.bin"

["docs:clean:src"]
description = "Clean Hugo source"
run = "rm -rf docs/.src"

["docs:clean:all"]
description = "Clean everything"
run = "rm -rf docs/.src docs/.bin docs/.dist docs/.data docs/.hugo_build.lock"
