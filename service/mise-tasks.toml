# service - system service installer (in-repo Go code)

["service:bin:build"]
description = "Build service binary"
dir = "service"
env = { GOWORK = "off" }
sources = ["service/*.go", "service/go.mod", "service/go.sum"]
outputs = ["service/.bin/plat-telemetry-svc"]
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
mkdir -p .bin
go build -o .bin/plat-telemetry-svc${EXE} .
"""

["service:ensure"]
description = "Ensure service binary exists"
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
[ -f service/.bin/plat-telemetry-svc${EXE} ] && exit 0
mise run service:bin:build
"""

["service:install"]
description = "Install as system service (launchd/systemd)"
depends = ["service:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
service/.bin/plat-telemetry-svc${EXE} install
"""

["service:uninstall"]
description = "Uninstall system service"
depends = ["service:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
service/.bin/plat-telemetry-svc${EXE} uninstall
"""

["service:start"]
description = "Start the system service"
depends = ["service:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
service/.bin/plat-telemetry-svc${EXE} start
"""

["service:stop"]
description = "Stop the system service"
depends = ["service:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
service/.bin/plat-telemetry-svc${EXE} stop
"""

["service:status"]
description = "Check service status"
depends = ["service:ensure"]
run = """
#!/usr/bin/env bash
EXE=$(go env GOEXE)
service/.bin/plat-telemetry-svc${EXE} status
"""

["service:clean"]
description = "Clean build artifacts"
run = "rm -rf service/.bin"
