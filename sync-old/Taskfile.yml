version: '3'

vars:
  SYNC_BIN_NAME: sync
  SYNC_BIN: '{{.TASKFILE_DIR}}/.bin'
  SYNC_DATA: '{{.TASKFILE_DIR}}/.data'
  SYNC_BIN_PATH: '{{.SYNC_BIN}}/{{.SYNC_BIN_NAME}}{{exeExt}}'
  SYNC_PORT: '{{.SYNC_PORT | default "9090"}}'

env:
  GOWORK: off

tasks:
  # src: tasks (sync is in-repo code, no-ops for conformance)
  src:clone:
    desc: No-op (sync is in-repo code)
    cmds:
      - 'true'

  src:update:
    desc: No-op (sync is in-repo code)
    cmds:
      - 'true'

  # bin: tasks
  bin:build:
    desc: Build sync binary from source
    dir: '{{.TASKFILE_DIR}}'
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.SYNC_BIN_PATH}}"
      - "{{.SYNC_BIN}}/.version"
    cmds:
      - mkdir -p {{.SYNC_BIN}}
      - go build -o {{.SYNC_BIN_PATH}} .
      - '{{.SYNC_BIN_PATH}} version-file {{.SYNC_BIN_PATH}} --src={{.ROOT_DIR}}'

  bin:download:
    desc: Download pre-built sync binary (USER)
    vars:
      RELEASE_REPO: '{{.RELEASE_REPO | default "joeblew999/plat-telemetry"}}'
      RELEASE_VERSION: '{{.RELEASE_VERSION | default "latest"}}'
    cmds:
      - mkdir -p {{.SYNC_BIN}}
      - |
        gh release download {{.RELEASE_VERSION}} \
          --repo {{.RELEASE_REPO}} \
          --pattern "{{.SYNC_BIN_NAME}}-{{OS}}-{{ARCH}}.tar.gz" \
          --output - | tar xz -C {{.SYNC_BIN}}
      - chmod +x {{.SYNC_BIN_PATH}}

  # Service tasks (alphabetical)
  cf:check:
    desc: Check if cloudflared is installed
    deps: [ensure]
    cmds:
      - '{{.SYNC_BIN_PATH}} cf check'

  cf:install:
    desc: Install cloudflared
    deps: [ensure]
    cmds:
      - '{{.SYNC_BIN_PATH}} cf install'

  cf:tunnel:
    desc: Start cloudflared quick tunnel
    deps: [ensure]
    cmds:
      - '{{.SYNC_BIN_PATH}} cf tunnel {{.SYNC_PORT}}'

  config:port:
    desc: Output service port
    cmds:
      - echo "{{.SYNC_PORT}}"
    silent: true

  config:version:
    desc: Output pinned version (uses git commit since sync is in-repo)
    deps: [ensure]
    cmds:
      - '{{.SYNC_BIN_PATH}} version-file {{.SYNC_BIN_PATH}} --read'
    silent: true

  deps:
    desc: Download Go dependencies
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go mod download
    status:
      - test -f go.sum

  ensure:
    desc: Ensure binary exists (build from source)
    status:
      - test -f {{.SYNC_BIN_PATH}}
    cmds:
      - task: bin:build

  health:
    desc: Check webhook server health
    cmds:
      - curl -sf http://localhost:{{.SYNC_PORT}}/health > /dev/null

  health:poller:
    desc: Check poller service health (always returns success if running)
    cmds:
      - exit 0

  package:
    desc: Package sync binary for release
    deps: [bin:build]
    vars:
      GOOS: '{{.GOOS | default OS}}'
      GOARCH: '{{.GOARCH | default ARCH}}'
      DIST: '{{.DIST | default .DIST_DIR | default "../.dist"}}'
    cmds:
      - mkdir -p {{.DIST}}
      - tar czf {{.DIST}}/{{.SYNC_BIN_NAME}}-{{.GOOS}}-{{.GOARCH}}.tar.gz -C {{.SYNC_BIN}} {{.SYNC_BIN_NAME}} .version

  poll:
    desc: Run polling service for upstream repos
    deps: [ensure]
    cmds:
      - "{{.SYNC_BIN_PATH}} poll"

  poll:taskfiles:
    desc: Run Taskfile polling service for version changes
    deps: [ensure]
    cmds:
      - "{{.SYNC_BIN_PATH}} poll-taskfiles"

  run:
    desc: Run sync service (webhook server + tunnel)
    deps: [ensure]
    env:
      PORT: "{{.SYNC_PORT}}"
      SMEE_URL: "{{.SMEE_URL | default \"\"}}"
      SYNC_DATA: "{{.SYNC_DATA}}"
    cmds:
      - "{{.SYNC_BIN_PATH}} serve"

  run:webhook:
    desc: Run webhook server only (no tunnel)
    deps: [ensure]
    env:
      PORT: "{{.SYNC_PORT}}"
    cmds:
      - "{{.SYNC_BIN_PATH}} webhook"

  state:
    desc: "Capture GitHub state (usage: task sync:state REPO=owner/repo)"
    deps: [ensure]
    vars:
      REPO: '{{.REPO | default ""}}'
      STATE_DIR: '{{.STATE_DIR | default (print .ROOT_DIR "/.github/state")}}'
    cmds:
      - "{{.SYNC_BIN_PATH}} state {{.REPO}} --dir={{.STATE_DIR}}"

  state:show:
    desc: Show captured GitHub state
    deps: [ensure]
    vars:
      STATE_DIR: '{{.STATE_DIR | default (print .ROOT_DIR "/.github/state")}}'
    cmds:
      - "{{.SYNC_BIN_PATH}} state --show --dir={{.STATE_DIR}}"

  test:
    desc: Run unit tests
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - go test -v ./...

  tunnel:
    desc: "Forward smee.io webhooks to local (usage: task sync:tunnel SMEE_URL=https://smee.io/xxx)"
    deps: [ensure]
    vars:
      SMEE_URL: '{{.SMEE_URL | default "new"}}'
      TARGET: '{{.TARGET | default "http://localhost:9090/webhook"}}'
    cmds:
      - "{{.SYNC_BIN_PATH}} tunnel {{.SMEE_URL}} {{.TARGET}}"

  tunnel:setup:
    desc: "Create smee channel and configure GitHub webhook (usage: task sync:tunnel:setup REPO=owner/repo)"
    deps: [ensure]
    vars:
      REPO: '{{.REPO | default "joeblew999/plat-telemetry"}}'
      EVENTS: '{{.EVENTS | default "push,release,workflow_run,page_build,deployment_status"}}'
    cmds:
      - "{{.SYNC_BIN_PATH}} tunnel-setup {{.REPO}} --events={{.EVENTS}}"

  # clean: tasks (alphabetical)
  clean:
    desc: Clean built binaries
    cmds:
      - rm -rf {{.SYNC_BIN}}

  clean:all:
    desc: Clean everything (binaries + data)
    cmds:
      - rm -rf {{.SYNC_BIN}} {{.SYNC_DATA}}

  clean:data:
    desc: Clean runtime data
    cmds:
      - rm -rf {{.SYNC_DATA}}
