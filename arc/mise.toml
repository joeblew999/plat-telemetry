[vars]
bin_name = "arc"
upstream_repo = "https://github.com/basekick-labs/arc.git"
version = "main"
src = "{{config_root}}/.src"
bin = "{{config_root}}/.bin"
bin_path = "{{config_root}}/.bin/arc"
data = "{{config_root}}/.data"
release_repo = "joeblew999/plat-telemetry"
release_version = "latest"
release_url = "https://github.com/joeblew999/plat-telemetry/releases/download/latest"
dist_dir = "{{config_root}}/../.dist"

[env]
GOWORK = "off"

# --- src: tasks ---

[tasks."src:clone"]
description = "Clone the upstream repository at pinned version"
run = "test -d {{vars.src}} || git clone --branch {{vars.version}} --depth 1 {{vars.upstream_repo}} {{vars.src}}"

[tasks."src:update"]
description = "Fetch and checkout pinned version"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["git fetch origin {{vars.version}}", "git checkout {{vars.version}}"]

# --- bin: tasks ---

[tasks."bin:build"]
description = "Build arc binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
go build -o {{vars.bin_path}} ./cmd/arc
{
  echo "commit: $(git -C {{vars.src}} rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
  echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
  echo "checksum: $(shasum -a 256 {{vars.bin_path}} | awk '{print $1}')"
} > {{vars.bin}}/.version
"""

[tasks."bin:download"]
description = "Download pre-built binary from release"
run = """
test -f {{vars.bin_path}} && exit 0
mkdir -p {{vars.bin}}
GOOS=$(go env GOOS)
GOARCH=$(go env GOARCH)
curl -L {{vars.release_url}}/{{vars.bin_name}}-${GOOS}-${GOARCH}.tar.gz | tar xz -C {{vars.bin}}
echo "{{vars.release_version}}" > {{vars.bin}}/.version
"""

# --- dev: tasks ---

[tasks."dev:run"]
description = "Run arc from source (development mode)"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = ["mkdir -p {{vars.data}}", "go run ./cmd/arc --config {{config_root}}/arc.toml"]

# --- service tasks (alphabetical) ---

[tasks.bench]
description = "Run benchmarks"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go test -bench=. -benchmem ./..."

[tasks."config:version"]
description = "Output the pinned version"
run = "echo {{vars.version}}"
quiet = true

[tasks.deps]
description = "Download dependencies"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go mod download"

[tasks.ensure]
description = "Ensure binary exists (build from source)"
run = "test -f {{vars.bin_path}} || mise run -C {{config_root}} bin:build"

[tasks.health]
description = "Check if Arc is healthy"
run = "curl -sf http://localhost:8000/health > /dev/null"

[tasks.install]
description = "Install arc binary"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go install ./cmd/arc"

[tasks.run]
description = "Run arc binary"
depends = ["ensure"]
run = ["mkdir -p {{vars.data}}", "{{vars.bin_path}} --config {{config_root}}/arc.toml"]

[tasks.test]
description = "Run tests"
depends = ["src:clone"]
dir = "{{vars.src}}"
run = "go test -v ./..."

[tasks.package]
description = "Package binary for release"
run = """
GOOS=${GOOS:-$(go env GOOS)}
GOARCH=${GOARCH:-$(go env GOARCH)}
DIST=${DIST:-{{vars.dist_dir}}}
tar -czvf ${DIST}/{{vars.bin_name}}-${GOOS}-${GOARCH}.tar.gz -C {{vars.bin}} {{vars.bin_name}}
"""

# --- clean: tasks (alphabetical) ---

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf {{vars.bin}}"

[tasks."clean:all"]
description = "Clean everything (.src, .bin, .data)"
run = "rm -rf {{vars.src}} {{vars.bin}} {{vars.data}}"

[tasks."clean:data"]
description = "Clean data directory"
run = "rm -rf {{vars.data}}"

[tasks."clean:src"]
description = "Clean source directory"
run = "rm -rf {{vars.src}}"
