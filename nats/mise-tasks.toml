# NATS is installed via mise ubi (nats-io/nats-server).
# The nats-server binary is on PATH after `mise install`.
# Source tasks are kept for dev workflow (build from source).

["nats:src:clone"]
description = "Clone upstream NATS repository"
run = """
[ -d nats/.src ] && exit 0
git clone --branch "${NATS_VERSION:-v2.10.24}" --depth 1 https://github.com/nats-io/nats-server.git nats/.src
"""

["nats:src:update"]
description = "Fetch and checkout pinned version"
depends = ["nats:src:clone"]
dir = "nats/.src"
run = """
git fetch --tags
git checkout "${NATS_VERSION:-v2.10.24}"
"""

["nats:bin:build"]
description = "Build nats-server from source (dev mode)"
depends = ["nats:src:clone"]
dir = "nats/.src"
env = { GOWORK = "off" }
run = """
#!/usr/bin/env bash
set -euo pipefail
EXE=$(go env GOEXE)
[ -f ../.bin/nats-server${EXE} ] && exit 0
mkdir -p ../.bin
go build -o ../.bin/nats-server${EXE} .
{
  echo "commit: $(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
  echo "timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
  echo "checksum: $(sha256sum ../.bin/nats-server${EXE} 2>/dev/null || shasum -a 256 ../.bin/nats-server${EXE} | awk '{print $1}')"
} > ../.bin/.version
"""

["nats:ensure"]
description = "Ensure nats-server is available (mise-managed)"
run = """
#!/usr/bin/env bash
command -v nats-server >/dev/null 2>&1 && exit 0
EXE=$(go env GOEXE)
[ -f nats/.bin/nats-server${EXE} ] && exit 0
echo "nats-server not found. Run: mise install"
exit 1
"""

["nats:run"]
description = "Run nats-server"
depends = ["nats:ensure"]
run = """
mkdir -p nats/.data
nats-server --config nats/nats.conf
"""

["nats:health"]
description = "Check NATS health"
run = "curl -sf http://localhost:8222/healthz > /dev/null"

["nats:dev:run"]
description = "Run nats from source (development)"
depends = ["nats:src:clone"]
dir = "nats/.src"
env = { GOWORK = "off" }
run = """
mkdir -p ../.data
go run . --config ../nats.conf
"""

["nats:config:version"]
description = "Output pinned version"
run = 'echo "${NATS_VERSION:-v2.10.24}"'

["nats:deps"]
description = "Download Go dependencies"
depends = ["nats:src:clone"]
dir = "nats/.src"
env = { GOWORK = "off" }
run = "go mod download"

["nats:test"]
description = "Run NATS tests"
depends = ["nats:src:clone"]
dir = "nats/.src"
env = { GOWORK = "off" }
run = "go test -v ./..."

["nats:package"]
description = "Package nats-server for release"
run = """
#!/usr/bin/env bash
set -euo pipefail
GOOS="${GOOS:-$(go env GOOS)}"
GOARCH="${GOARCH:-$(go env GOARCH)}"
DIST="${DIST:-$DIST_DIR}"
EXE=$(go env GOEXE)
mkdir -p "$DIST"
# Use `mise which` to get the actual binary path including .exe on Windows
# (command -v returns the shim path which may lack .exe)
if MISE_BIN="$(mise which nats-server 2>/dev/null)" && [ -f "$MISE_BIN" ]; then
  BIN_PATH="$MISE_BIN"
elif [ -f "nats/.bin/nats-server${EXE}" ]; then
  BIN_PATH="nats/.bin/nats-server${EXE}"
else
  echo "nats-server not found"; exit 1
fi
if [ "$GOOS" = "windows" ]; then
  ouch compress -y "$BIN_PATH" "$DIST/nats-server-${GOOS}-${GOARCH}.zip"
else
  ouch compress -y "$BIN_PATH" "$DIST/nats-server-${GOOS}-${GOARCH}.tar.gz"
fi
"""

["nats:clean"]
description = "Clean build artifacts"
run = "rm -rf nats/.bin"

["nats:clean:all"]
description = "Clean everything"
run = "rm -rf nats/.src nats/.bin nats/.data"

["nats:clean:data"]
description = "Clean data directory"
run = "rm -rf nats/.data"

["nats:clean:src"]
description = "Clean source directory"
run = "rm -rf nats/.src"
